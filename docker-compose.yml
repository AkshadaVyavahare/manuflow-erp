version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: manuflow_db
    environment:
      POSTGRES_DB: manuflow_db
      POSTGRES_USER: manuflow_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: manuflow_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manuflow_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_NAME=manuflow_db
      - DB_USER=manuflow_user
      - DB_PASS=secretpassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-prod-key-manuflow-2026
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: manuflow_celery
    command: celery -A core worker -l info
    volumes:
      - ./backend:/app
    environment:
      - DB_NAME=manuflow_db
      - DB_USER=manuflow_user
      - DB_PASS=secretpassword
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-prod-key-manuflow-2026
    depends_on:
      - backend
      - redis

volumes:
  postgres_data:
